                        id:
                          type: string
                          format: uuid
                        ticket_id:
                          type: string
                          format: uuid
                        user_id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                          format: uuid
                        original_name:
                          type: string
                          example: factura-noviembre.jpg
                        extension:
                          type: string
                          example: .jpg
                        mime_type:
                          type: string
                          example: image/jpeg
