                    example: success
                  fileId:
                    type: string
                    format: uuid
                  ticketId:
                    type: string
                    format: uuid
                  orgId:
                    type: string
                    format: uuid
                  ownerUserId:
                    type: string
                    format: uuid
                  originalName:
                    type: string
                    example: factura-noviembre.jpg
                  extension:
