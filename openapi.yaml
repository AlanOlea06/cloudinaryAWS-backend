      tags: [Upload Multipart]
      summary: Abortar una subida Multipart en curso y limpiar partes en S3
      description: Cancela la sesión multipart en Amazon S3 (`AbortMultipartUploadCommand`) para liberar el almacenamiento de las partes subidas y marca el ticket como `failed` (o elimina la fila si se envía `deleteRow=true`).
      security:
