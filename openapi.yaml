        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - triggerWebhook
              properties:
                triggerWebhook:
                  type: boolean
                  example: true
                action:
                  type: string
                  enum: [webhook]
                  example: webhook
      responses:
        "200":
          description: Resultado del despacho manual del webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  fileId:
                    type: string
                    format: uuid
                  fileStatus:
                    type: string
                    example: uploaded
                  scanStatus:
                    type: string
                    example: not_scanned
                  webhook:
                    $ref: "#/components/schemas/WebhookDispatchResult"
        "400":
          description: "`INVALID_FILE_ID` o `SERVER_PROCESSING_DISABLED` (si no se envió `triggerWebhook: true`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`FORBIDDEN_CROSS_ORGANIZATION`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`FILE_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/keys:
    get:
      operationId: listApiKeys
      tags: [API Keys]
      summary: Listar las API Keys de tu organización
      description: |
        Devuelve los metadatos de todas las API Keys de tu organización (sin exponer nunca la llave en texto plano ni su hash SHA-256).
        **Requiere una API Key de organización con `can_manage_keys = true`.**
      security:
        - ApiKeyAuth: []
      parameters:
        - name: org_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Opcional. Si usas una llave delegada, debe coincidir con tu propia organización o se devolverá `403 FORBIDDEN_CROSS_ORG`.
      responses:
        "200":
          description: Lista de API Keys de la organización.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  count:
                    type: integer
                    example: 2
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                          format: uuid
                        user_id:
                          type: string
                          format: uuid
                          nullable: true
                        name:
                          type: string
                          example: Llave Maestra Backend
                        can_read:
                          type: boolean
                        can_upload:
                          type: boolean
                        can_delete:
                          type: boolean
                        can_manage_keys:
                          type: boolean
                        is_active:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
        "400":
          description: "`INVALID_ORG_ID`: El parámetro `org_id` no es un UUID v4 válido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`AUTHENTICATION_REQUIRED`: No se envió `x-api-key`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            - `INVALID_OR_INACTIVE_API_KEY`: La llave no existe o está revocada.
            - `USER_KEY_CANNOT_MANAGE_KEYS`: Las llaves vinculadas a un usuario (`user_id != null`) nunca pueden gestionar llaves.
            - `CANNOT_MANAGE_KEYS`: La llave tiene `can_manage_keys = false`.
            - `FORBIDDEN_CROSS_ORG`: Intentaste consultar `org_id` de otra organización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`KEYS_RATE_LIMIT_EXCEEDED`: Superaste las 20 peticiones por minuto en rutas de administración."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createApiKey
      tags: [API Keys]
      summary: Crear una nueva API Key secundaria para tu organización
      description: |
        Permite a una API Key Maestra de organización (`can_manage_keys = true`) crear llaves operativas adicionales (dentro del cupo `max_api_keys` de la organización, por defecto 3).
        - **Seguridad Zero-Knowledge:** El valor en texto plano `apiKey` (`sk_live_...`) **se devuelve únicamente en esta respuesta `201 Created`** y nunca vuelve a mostrarse.
        - **Anti-escalada:** No puedes otorgar permisos (`canRead`, `canUpload`, `canDelete`) que tu propia llave no tenga, y toda llave creada por delegación nace siempre con `can_manage_keys: false`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                  description: Nombre descriptivo de la llave (entre 2 y 80 caracteres).
                  example: Servidor de Facturación - Subida
                userId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Opcional. Si se envía un UUID de usuario perteneciente a la organización, la llave quedará vinculada exclusivamente a ese usuario (`user_bound`). Si es `null` o se omite, será una llave de organización (`organization_backend`).
                  example: null
                canRead:
                  type: boolean
                  default: true
                  example: true
                canUpload:
                  type: boolean
                  default: true
                  example: true
                canDelete:
                  type: boolean
                  default: false
                  example: false
      responses:
        "201":
          description: API Key creada exitosamente. Guarda el campo `apiKey` de inmediato.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: created
                  message:
                    type: string
                    example: "IMPORTANTE: Guarda esta API Key en el backend en un lugar seguro. Por razones de seguridad (Zero-Knowledge), nunca volverá a mostrarse."
                  apiKey:
                    type: string
                    example: TU_API_KEY_GENERADA
                  keyMetadata:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      org_id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                        nullable: true
                      name:
                        type: string
                      can_read:
                        type: boolean
                      can_upload:
                        type: boolean
                      can_delete:
                        type: boolean
                      can_manage_keys:
                        type: boolean
                        example: false
                      is_active:
                        type: boolean
                        example: true
                      scope:
                        type: string
                        enum: [organization_backend, user_bound]
                      maxAllowedForOrg:
                        type: integer
                        example: 3
        "400":
          description: |
            - `INVALID_KEY_NAME`: `name` es obligatorio y debe tener entre 2 y 80 caracteres.
            - `INVALID_USER_ID`: `userId` no es un UUID v4 válido.
            - `INVALID_KEY_CONFIG`: Configuración inválida (una llave con `userId` no nulo nunca puede tener `canManageKeys=true`).
            - `INVALID_ORG_ID`: `orgId` inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`AUTHENTICATION_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            - `INVALID_OR_INACTIVE_API_KEY`, `USER_KEY_CANNOT_MANAGE_KEYS`, `CANNOT_MANAGE_KEYS`.
            - `PRIVILEGE_ESCALATION_BLOCKED`: Intentaste crear una llave con permisos (`canRead`, `canUpload` o `canDelete`) que tu propia llave no posee.
            - `USER_ORG_MISMATCH`: El `userId` indicado pertenece a otra organización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`ORGANIZATION_NOT_FOUND` o `USER_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            - `MAX_API_KEYS_LIMIT_REACHED`: Tu organización ya alcanzó el máximo de llaves activas (`max_api_keys`, por defecto 3). **Acción:** Revoca o elimina una llave secundaria en desuso con `DELETE /api/keys?id=<uuid>` antes de crear otra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`KEYS_RATE_LIMIT_EXCEEDED` (máximo 20 req / 60s)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteOrRevokeApiKey
      tags: [API Keys]
      summary: Revocar o eliminar una API Key de tu organización
      description: |
        Permite desactivar (`mode=revoke`, pone `is_active = false`) o borrar permanentemente (`mode=delete`, por defecto) una API Key de tu organización.
        - **Reglas de protección:**
          1. Una llave no puede revocarse ni eliminarse a sí misma (`403 CANNOT_DELETE_SELF`).
          2. No se puede eliminar ni revocar la última llave activa con `can_manage_keys = true` de la organización (`403 CANNOT_DELETE_LAST_MANAGE_KEY`).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID de la API Key a revocar o eliminar (también acepta `keyId` o enviarlo en el body JSON).
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [delete, revoke]
            default: delete
          description: "`revoke` desactiva la llave (`is_active=false`); `delete` la borra de la base de datos."
      responses:
        "200":
          description: 'API Key revocada (`status: "revoked"`) o eliminada (`status: "deleted"`).'
        "400":
          description: "`INVALID_KEY_ID`: El `id` no es un UUID v4 válido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            - `CANNOT_DELETE_SELF`: No puedes eliminar ni revocar la misma API Key con la que estás autenticando la petición.
            - `CANNOT_DELETE_LAST_MANAGE_KEY`: No se puede eliminar la última llave administradora activa de la organización.
            - `CANNOT_MANAGE_KEYS` / `USER_KEY_CANNOT_MANAGE_KEYS`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`API_KEY_NOT_FOUND`: La llave no existe o pertenece a otra organización."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`KEYS_RATE_LIMIT_EXCEEDED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/organizations:
    get:
      operationId: getOrganization
      tags: [Organizations & Webhooks]
      summary: Consultar cuotas y configuración de Webhook de tu organización
      description: |
        Devuelve los límites de cuota (`max_storage_bytes`, `max_pending_tickets`, `max_api_keys`) y la `webhook_url` actual de tu organización.
        **Requiere una API Key de organización con `can_manage_keys = true`.** (Por seguridad, `webhook_secret` nunca se devuelve en lecturas).
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Datos de la organización.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  count:
                    type: integer
                    example: 1
                  organizations:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 11111111-1111-1111-1111-111111111111
                      name:
                        type: string
                        example: Organización 1
                      slug:
                        type: string
                        example: org-1
                      webhook_url:
                        type: string
                        nullable: true
                        example: https://mi-backend.ejemplo.com/webhooks/archivos
                      max_storage_bytes:
                        type: integer
                        example: 5368709120
                      max_pending_tickets:
                        type: integer
                        example: 20
                      max_api_keys:
                        type: integer
                        example: 3
                      created_at:
                        type: string
                        format: date-time
        "401":
          description: "`AUTHENTICATION_REQUIRED` o `UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`CANNOT_MANAGE_KEYS`, `CANNOT_MANAGE_ORGANIZATION`, `USER_KEY_CANNOT_MANAGE_KEYS` o `FORBIDDEN_CROSS_ORG`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`KEYS_RATE_LIMIT_EXCEEDED` (20 req / 60s)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createOrganization
      tags: [Organizations & Webhooks]
      summary: Registrar automáticamente una nueva organización, usuario inicial y API Key Maestra (Onboarding con inviteCode)
      description: |
        Permite a cualquier plataforma o desarrollador autorizado dar de alta su propia organización enviando el código de invitación (`inviteCode` en el body o en la cabecera `x-invite-code`).
        En un solo paso crea:
        1. La organización con sus cuotas iniciales (`1 GB` de almacenamiento, `20` tickets pendientes, `3` API Keys).
        2. Un usuario inicial aislado a la organización.
        3. Su **API Key Maestra (`can_manage_keys = true`)**, mostrada por única vez en la respuesta (`201 Created`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - inviteCode
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                  example: Mi Plataforma E-Commerce
                slug:
                  type: string
                  example: mi-plataforma-ecommerce
                inviteCode:
                  type: string
                  description: Código de invitación proporcionado para registrar una nueva organización en el servicio.
                  example: TU_CODIGO_DE_INVITACION
                webhookUrl:
                  type: string
                  format: uri
                  nullable: true
                  example: https://api.mi-plataforma.com/webhooks/storage
                webhookSecret:
                  type: string
                  nullable: true
                  example: TU_WEBHOOK_SECRET
      responses:
        "201":
          description: Organización, usuario inicial y API Key Maestra creados exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: created
                  message:
                    type: string
                  apiKey:
                    type: string
                    example: TU_API_KEY_GENERADA
                  organization:
                    type: object
                  defaultUser:
                    type: object
                  keyMetadata:
                    type: object
        "400":
          description: "`INVALID_ORG_NAME` o error de validación SSRF en `webhookUrl`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`MISSING_INVITE_CODE`: No se envió `inviteCode` ni cabecera `x-invite-code`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`INVALID_INVITE_CODE`: El código de invitación no es válido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`KEYS_RATE_LIMIT_EXCEEDED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateOrganizationWebhooks
      tags: [Organizations & Webhooks]
      summary: Configurar la URL y el secreto HMAC-SHA256 de Webhooks de tu organización
      description: |
        Permite a una API Key con `can_manage_keys = true` configurar o desactivar (`null`) el destino `webhookUrl` y el secreto `webhookSecret` de su propia organización.
        - **Validación Anti-SSRF en tiempo real:** `webhookUrl` debe usar obligatoriamente `https://`, no contener credenciales en la URL y resolver por DNS exclusivamente a direcciones IP públicas (se bloquean `localhost`, loopback `127.0.0.0/8`, `::1`, redes privadas RFC1918, link-local `169.254.0.0/16` y rangos reservados).
        - **Nota:** Los campos de cuotas (`maxStorageBytes`, `maxPendingTickets`, `maxApiKeys`, `name`) son exclusivos de administración interna; intentar modificarlos con una API Key devuelve `403 FORBIDDEN_QUOTA_MODIFICATION`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: URL HTTPS pública de tu servidor donde recibirás los eventos `POST` (o `null` para desactivar webhooks).
                  example: https://api.tu-dominio.com/webhooks/storage
                webhookSecret:
                  type: string
                  nullable: true
                  description: Secreto compartido para firmar los payloads con HMAC-SHA256 en la cabecera `x-webhook-signature`.
                  example: TU_WEBHOOK_SECRET
      responses:
        "200":
          description: Configuración de webhook actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updated
                  message:
                    type: string
                    example: Organización actualizada exitosamente.
                  organization:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      slug:
                        type: string
                      webhook_url:
                        type: string
                        nullable: true
                      max_storage_bytes:
                        type: integer
                      max_pending_tickets:
                        type: integer
                      max_api_keys:
                        type: integer
        "400":
          description: |
            URL de webhook rechazada por validación SSRF o petición vacía. Códigos posibles:
            - `SSRF_URL_MALFORMED`: La URL no tiene un formato válido.
            - `SSRF_PROTOCOL_NOT_HTTPS`: La URL debe comenzar con `https://` (no se permite `http://`).
            - `SSRF_CREDENTIALS_IN_URL`: No se permiten credenciales `usuario:password@` dentro de la URL.
            - `SSRF_BLOCKED_HOST`: El dominio es `localhost`, `*.localhost` o `*.internal`.
            - `SSRF_BLOCKED_IP`: El dominio o IP apunta a una dirección privada, loopback o reservada.
            - `SSRF_DNS_EMPTY` / `SSRF_DNS_ERROR`: El dominio no pudo resolverse mediante DNS público.
            - `NO_CHANGES_PROVIDED`: No se enviaron `webhookUrl` ni `webhookSecret`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            - `FORBIDDEN_QUOTA_MODIFICATION`: Intentaste modificar cuotas (`maxStorageBytes`, `maxPendingTickets`, `maxApiKeys`) o `name` con una API Key. **Acción:** Envía únicamente `webhookUrl` y `webhookSecret`.
            - `FORBIDDEN_CROSS_ORG`: Intentaste modificar otra organización.
            - `CANNOT_MANAGE_KEYS` / `CANNOT_MANAGE_ORGANIZATION`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`KEYS_RATE_LIMIT_EXCEEDED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/logs:
    get:
      operationId: listServiceLogs
      tags: [Logs]
      summary: Consultar bitácora paginada de eventos de tu organización
      description: |
        Devuelve los eventos de auditoría registrados en `service_logs` en orden cronológico inverso (del más reciente al más antiguo), incluyendo la dirección IP real de origen (`ipAddress`).
        - **Con `x-api-key` de una Organización:** Devuelve exclusivamente los logs pertenecientes a esa organización (`scope: "organization"`).
        - **Con la llave de Administrador:** Devuelve todos los logs del sistema (`scope: "admin_all"`).
        - **Sin llave:** Devuelve `401 AUTHENTICATION_REQUIRED`.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página (empezando en 1).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Cantidad de registros por página (por defecto 20, máximo 100).
      responses:
        "200":
          description: Página de registros de auditoría.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 280
                  total:
                    type: integer
                    example: 280
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  totalPages:
                    type: integer
                    example: 14
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 280
                        timestamp:
                          type: string
                          format: date-time
                        method:
                          type: string
                          example: PUT
                        action:
                          type: string
                          example: S3_UPLOAD_CONFIRMED
                        status:
                          type: string
                          example: UPLOADED
                        ticketId:
                          type: string
                          format: uuid
                          nullable: true
                        fileId:
                          type: string
                          format: uuid
                          nullable: true
                        userId:
                          type: string
                          format: uuid
                          nullable: true
                        userName:
                          type: string
                          nullable: true
                        orgId:
                          type: string
                          format: uuid
                          nullable: true
                        orgName:
                          type: string
                          nullable: true
                        fileName:
                          type: string
                          nullable: true
                        extension:
                          type: string
                          nullable: true
                        mimeType:
                          type: string
                          nullable: true
                        fileSize:
                          type: integer
                          nullable: true
                        resourceType:
                          type: string
                          nullable: true
                        visibility:
                          type: string
                          nullable: true
                        ipAddress:
                          type: string
                          nullable: true
                        message:
                          type: string
                          nullable: true
        "400":
          description: Parámetros de paginación inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error al consultar la bitácora en la base de datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
