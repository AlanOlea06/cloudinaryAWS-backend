            format: uuid
          description: Filtrar archivos por UUID de usuario propietario.
      responses:
        "200":
          description: Lista de archivos de la organización (sin exponer claves internas de S3).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  count:
                    type: integer
                    example: 1
                  files:
