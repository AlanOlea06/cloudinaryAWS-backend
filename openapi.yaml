      summary: Borrado masivo de archivos por usuario u organización (Derecho de Supresión)
      description: Elimina todos los objetos en S3, aborta multiparts activos y borra los registros en base de datos pertenecientes a un usuario (`?userId=<uuid>` o `x-user-id`) o de toda la organización (`?confirmOrgWipe=true`). Requiere `can_delete = true`.
