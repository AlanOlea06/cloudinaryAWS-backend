    post:
      operationId: triggerFileWebhook
      tags: [Files]
      summary: Re-enviar notificación Webhook manualmente para un archivo
      description: |
        Dispara manualmente una entrega de webhook firmada con HMAC-SHA256 hacia la `webhook_url` configurada en la organización cuando se envía `{ "triggerWebhook": true }` (o `{ "action": "webhook" }`).
        > Si se invoca sin `triggerWebhook: true`, devuelve `400 SERVER_PROCESSING_DISABLED` porque el procesamiento binario en servidor está deshabilitado en Vercel.
