  /api/files/{id}:
    get:
      operationId: getFileDeliveryUrl
      tags: [Files]
      summary: Obtener URL de descarga de un archivo (CloudFront público o S3 prefirmada privada de 5 min)
      description: |
        Devuelve la URL para descargar o visualizar el archivo según su visibilidad:
        - **Archivos `public`**: Devuelve `delivery: "cloudfront"` con la URL pública de Amazon CloudFront CDN (`https://<cloudfront-domain>/static/files/<rand128>.<ext>`).
        - **Archivos `private`**: Verifica estrictamente que el usuario en `x-user-id` sea el **propietario** (`ownerUserId`) que subió el archivo. Si es válido, devuelve `delivery: "s3_presigned"` con una **URL prefirmada de Amazon S3 válida por 5 minutos (`300` segundos)** y `cloudfrontUrl: null`. **Cuando la URL privada expira tras 5 minutos, tu backend debe volver a llamar a este endpoint para obtener una nueva.**
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OptionalEndUserIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID v4 del archivo (`fileId`).
          example: b087905a-00fd-4bcf-812c-5d8ba159d6c1
      responses:
        "200":
          description: URL de entrega generada exitosamente.
          content:
            application/json:
              schema:
                type: object
              examples:
                private_file:
                  summary: Archivo privado (URL prefirmada de S3 por 5 minutos)
                  value:
                    url: https://practicas-alan-418272802078.s3.us-east-1.amazonaws.com/static/private/9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=300&...
                    delivery: s3_presigned
                    expiresInSeconds: 300
                    cloudfrontUrl: null
                    fileId: b087905a-00fd-4bcf-812c-5d8ba159d6c1
                    fileName: factura-noviembre.jpg
                    orgId: 11111111-1111-1111-1111-111111111111
                    ownerUserId: a1111111-0000-0000-0000-000000000001
                    visibility: private
                    fileStatus: uploaded
                    status: uploaded
                    sha256Verified: true
                    cacheControl: private, no-store, no-cache, max-age=0, must-revalidate
                public_file:
                  summary: Archivo público (URL de Amazon CloudFront CDN)
                  value:
                    url: https://d1nuawu3owad6c.cloudfront.net/static/files/1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d.png
                    delivery: cloudfront
                    cloudfrontDomain: d1nuawu3owad6c.cloudfront.net
                    cloudfrontUrl: https://d1nuawu3owad6c.cloudfront.net/static/files/1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d.png
                    fileId: b087905a-00fd-4bcf-812c-5d8ba159d6c1
                    fileName: banner-publico.png
                    orgId: 11111111-1111-1111-1111-111111111111
                    ownerUserId: a1111111-0000-0000-0000-000000000001
                    visibility: public
                    fileStatus: uploaded
                    status: uploaded
                    sha256Verified: true
                    cacheControl: public, max-age=300, must-revalidate
        "400":
          description: "`INVALID_FILE_ID`: El parámetro `{id}` no es un UUID v4 válido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Acceso denegado. Códigos posibles:
            - `FORBIDDEN_TENANT_MISMATCH`: El archivo pertenece a otra organización.
            - `FORBIDDEN_USER_IMPERSONATION`: El query param `?userId=` difiere del usuario autenticado en `x-user-id`.
            - `FORBIDDEN_PRIVATE_USER_REQUIRED`: El archivo es `private` y no enviaste `x-user-id`. **Acción:** Envía la cabecera `x-user-id` con el UUID del propietario.
            - `FORBIDDEN_PRIVATE_NOT_OWNER`: El archivo es `private` y el usuario en `x-user-id` no es el propietario que lo subió. **Acción:** Solo el usuario propietario puede leer archivos privados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            - `FILE_NOT_FOUND`: El archivo no existe en la base de datos.
            - `S3_KEY_NOT_FOUND`: El archivo no tiene clave de almacenamiento en S3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`DB_QUERY_FAILED`, `S3_PRESIGNED_READ_FAILED`, `CLOUDFRONT_NOT_CONFIGURED` o `CLOUDFRONT_URL_GENERATION_FAILED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteFileById
      tags: [Files]
      summary: Eliminar permanentemente un archivo de Amazon S3, invalidar caché en CloudFront y borrar de la base de datos
      description: Aborta cualquier subida multipart en curso para ese archivo, elimina el objeto físico en Amazon S3 (`DeleteObjectCommand`), dispara una invalidación de caché en Amazon CloudFront (`CreateInvalidation`) si el archivo era público y borra el registro de la base de datos, liberando cuota de almacenamiento (`max_storage_bytes`). Requiere una API Key con `can_delete = true`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OptionalEndUserIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: b087905a-00fd-4bcf-812c-5d8ba159d6c1
      responses:
        "200":
          description: Archivo eliminado de S3, caché de CloudFront invalidada (si aplica) y eliminado de base de datos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: El archivo 'factura-noviembre.jpg' fue eliminado exitosamente de S3 y de Supabase.
                  deletedFileId:
                    type: string
                    format: uuid
                  ticketId:
                    type: string
                    format: uuid
                  storageCleaned:
                    type: boolean
                    example: true
                  deletedObjectsCount:
                    type: integer
                    example: 1
                  multipartAborted:
                    type: boolean
                    example: false
                  cloudfrontInvalidated:
                    type: boolean
                    example: true
                  cloudfrontInvalidationId:
                    type: string
                    nullable: true
                    example: I2J0K1L2M3N4O5P6Q7R8S9
        "400":
          description: "`INVALID_FILE_ID`: El `{id}` no tiene formato UUID v4."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`INSUFFICIENT_API_KEY_PERMISSIONS` (la API Key tiene `can_delete=false`) o `FORBIDDEN_TENANT_MISMATCH`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`FILE_NOT_FOUND`: El archivo no existe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/files/{id}/status:
    get:
      operationId: getFileStatus
      tags: [Files]
      summary: Consultar estado transaccional, verificación SHA-256 y scan_status de un archivo
      description: 'Devuelve los metadatos completos de estado del archivo (`pending_upload`, `uploaded`, `failed`), resultado de integridad `sha256Verified` y estado de escaneo (`scanStatus: "not_scanned"`). Los archivos privados nunca exponen `cloudfrontUrl`.'
