openapi: 3.0.3
info:
  title: Cloudinary Clone AWS S3 / CloudFront — API de Consumo
  version: 2.1.0
  license:
    name: Proprietary
    url: https://cloudinary-aws-backend.vercel.app/docs
  description: |
    API REST para almacenamiento seguro de archivos multimedia y documentos (imágenes y PDF) con aislamiento Multi-Tenant, verificación criptográfica **SHA-256**, validación de cabeceras binarias (**Magic Bytes**), entrega por CDN (**Amazon CloudFront**) para archivos públicos y **URLs prefirmadas de Amazon S3** para archivos privados.

    ---
    ### Regla Fundamental de Arquitectura: "Ningún archivo binario pasa por el backend"
    1. Tu servidor solicita un **ticket de subida** (`POST /api/upload` o `POST /api/upload/multipart`).
    2. Tu servidor envía los bytes del archivo **directamente a Amazon S3** usando la `uploadUrl` prefirmada (`PUT`).
    3. Tu servidor **confirma la subida** (`PUT /api/upload?ticketId=...` o `PUT /api/upload/multipart`) enviando el `confirmToken`.

    > **Importante (CORS de S3):** Actualmente la subida a la `uploadUrl` de S3 debe ejecutarse desde tu **propio servidor (backend)** y no directamente desde el navegador del usuario final, ya que la política CORS del bucket S3 compartido no es modificable con los permisos actuales.

    ---
    ### Autenticación y Cabeceras Requeridas
    Todas las rutas operativas requieren autenticación mediante **API Key** en la cabecera `x-api-key`:
    - `x-api-key: sk_live_...` *(Obligatoria en todas las rutas protegidas)*.
    - `x-user-id: <uuid-v4>` *(Obligatoria al usar una API Key de organización sin usuario fijo cuando se crean tickets de subida o se consultan archivos privados)*. También se acepta el alias `x-end-user-id`.

    **Tipos de API Key:**
    1. **Llave de Organización Maestra (`user_id: null`, `can_manage_keys: true`)**: Permite operar en nombre de cualquier usuario de la organización (enviando `x-user-id`), gestionar llaves secundarias en `/api/keys` y configurar webhooks en `/api/organizations`.
    2. **Llave de Organización Operativa (`user_id: null`, `can_manage_keys: false`)**: Permite subir, leer o eliminar archivos (según sus banderas `can_read`, `can_upload`, `can_delete`) enviando `x-user-id`, pero no puede crear llaves ni modificar webhooks.
    3. **Llave Vinculada a Usuario (`user_id: <uuid>`, `can_manage_keys: false`)**: Opera exclusivamente como ese usuario. Si envías un `x-user-id` distinto al usuario vinculado, la petición será rechazada con `403 FORBIDDEN_USER_IMPERSONATION`.

    ---
    ### Límites, Cuotas, Tipos Permitidos y TTLs

    #### 1. Rate Limiting y Cabeceras `X-RateLimit-*`
    Cada respuesta autenticada incluye las cabeceras:
    - `X-RateLimit-Limit`: Máximo de peticiones permitidas en la ventana de 60 segundos.
    - `X-RateLimit-Remaining`: Peticiones restantes en la ventana actual.
    - `X-RateLimit-Reset`: Segundos restantes para que se reinicie la ventana.
    - `Retry-After`: Segundos que debes esperar antes de reintentar (presente cuando recibes `429 Too Many Requests`).

    | Ámbito | Límite por Ventana (60 s) | Código de Error al Exceder |
    | :--- | :--- | :--- |
    | Rutas operativas (`/api/upload`, `/api/files`, etc.) | **100 peticiones / 60 s** por API Key | `429 RATE_LIMIT_EXCEEDED` |
    | Gestión de llaves y organización (`/api/keys`, `/api/organizations`) | **20 peticiones / 60 s** por API Key o IP | `429 KEYS_RATE_LIMIT_EXCEEDED` |

    #### 2. Cuotas por Organización
    | Cuota | Campo en Organización | Valor por Defecto | Código de Error al Exceder |
    | :--- | :--- | :--- | :--- |
    | Almacenamiento total confirmado | `max_storage_bytes` | `1,073,741,824` bytes (1 GB) | `413 STORAGE_QUOTA_EXCEEDED` |
    | Tickets pendientes simultáneos (`pending_upload`) | `max_pending_tickets` | `20` tickets | `429 PENDING_TICKETS_QUOTA_EXCEEDED` |
    | API Keys activas simultáneas (`is_active = true`) | `max_api_keys` | `3` llaves activas | `409 MAX_API_KEYS_LIMIT_REACHED` |

    #### 3. Límites de Tamaño de Archivo
    | Flujo | Tamaño Mínimo | Tamaño Máximo | Notas |
    | :--- | :--- | :--- | :--- |
    | Subida Simple (`POST /api/upload`) | `1` byte | **25 MB** (`26,214,400` bytes) | Para archivos > 25 MB usa Multipart. |
    | Subida Multipart (`/api/upload/multipart`) | `1` byte | **500 MB** (`524,288,000` bytes) | Cada parte (excepto la última) debe medir mínimo **5 MB** (`5,242,880` bytes). Máximo `10,000` partes. |

    #### 4. Lista Blanca (Whitelist) de Tipos Permitidos
    | Extensión | MIME Type Obligatorio | Categoría | Content-Disposition |
    | :--- | :--- | :--- | :--- |
    | `.jpg` | `image/jpeg` | `images` | `inline` |
    | `.jpeg` | `image/jpeg` | `images` | `inline` |
    | `.png` | `image/png` | `images` | `inline` |
    | `.webp` | `image/webp` | `images` | `inline` |
    | `.gif` | `image/gif` | `images` | `inline` |
    | `.pdf` | `application/pdf` | `documents` | `attachment` *(forzado por seguridad)* |

    *Archivos `.html`, `.svg`, `.xml`, `.js`, ejecutables y videos (`video/*`) son rechazados explícitamente.*

    #### 5. Tiempo de Vida (TTL) de URLs y Tokens
    | Recurso | TTL | Notas |
    | :--- | :--- | :--- |
    | URL prefirmada PUT de subida simple (`uploadUrl`) | **300 s (5 min)** | El `confirmToken` incluye 2 min adicionales de gracia para confirmar (`PUT /api/upload`). |
    | Sesión y `confirmToken` de subida Multipart | **3600 s (60 min)** | Tiempo máximo para subir todas las partes y llamar a `complete`. |
    | URL prefirmada PUT de parte Multipart (`uploadPartUrl`) | **900 s (15 min)** | Se genera bajo demanda con `action: "presign_part"`. |
    | URL prefirmada GET de lectura privada (`GET /api/files/{id}`) | **300 s (5 min)** | No se almacena en caché (`Cache-Control: private, no-store...`). Debe solicitarse de nuevo al expirar. |
    | Caché CDN de archivo público (`cloudfrontUrl`) | **300 s (5 min)** | `Cache-Control: public, max-age=300, must-revalidate`. |

servers:
  - url: https://d1nuawu3owad6c.cloudfront.net
    description: Servidor de Producción AWS CloudFront (Sin caché para API, con caché en /static/* para S3)
  - url: https://cloudinary-aws-backend.vercel.app
    description: Servidor de Producción Espejo (Vercel)

tags:
  - name: Health
    description: Estado de salud del servicio.
  - name: Upload Simple
    description: Emisión de tickets de subida directa a S3 (<= 25 MB) y confirmación criptográfica.
  - name: Upload Multipart
    description: Subida fragmentada en partes a S3 para archivos grandes (hasta 500 MB).
  - name: Files
    description: Consulta, obtención de URLs de descarga (CloudFront / S3 Presigned), estado y eliminación de archivos.
  - name: API Keys
    description: Gestión de API Keys de la organización (requiere llave con `can_manage_keys=true`).
  - name: Organizations & Webhooks
    description: Consulta de cuotas y configuración de URL/secreto de Webhooks HMAC-SHA256.
  - name: Logs
    description: Bitácora de auditoría de eventos del servicio.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key activa de la organización o usuario (`sk_live_<64_hex>`).

  parameters:
    EndUserIdHeader:
      name: x-user-id
      in: header
      required: true
      schema:
        type: string
        example: "1"
      description: |
        Identificador del usuario final de tu plataforma (puede ser un ID numérico como `"1"`, un string como `"user_42"` o un UUID).
        - Nuestro backend deriva automáticamente un UUID aislado por organización (`UUID_SHA256(org_id + ":" + x-user-id)`) y lo auto-registra si aún no existe, garantizando **cero colisiones** entre organizaciones distintas.
        - **Obligatorio** al crear tickets de subida (`POST /api/upload`, `POST /api/upload/multipart`) si la API Key es de organización (`user_id: null`).
        - **Obligatorio** para leer archivos con `visibility: "private"` (`GET /api/files/{id}`), debiendo coincidir con el propietario que subió el archivo.
    OptionalEndUserIdHeader:
      name: x-user-id
      in: header
      required: false
      schema:
        type: string
        example: "1"
      description: Identificador del usuario final de tu plataforma (opcional en rutas de listado o borrado a nivel organización, obligatorio para verificar titularidad de archivos privados).

  headers:
    X-RateLimit-Limit:
      description: Límite máximo de peticiones permitidas en la ventana de 60 segundos.
      schema:
        type: integer
        example: 100
    X-RateLimit-Remaining:
      description: Peticiones restantes en la ventana actual de 60 segundos.
      schema:
        type: integer
        example: 99
    X-RateLimit-Reset:
      description: Segundos restantes hasta el reinicio de la ventana de rate limit.
      schema:
        type: integer
        example: 60
    Retry-After:
      description: Segundos que el cliente debe esperar antes de reintentar cuando recibe HTTP 429.
      schema:
        type: integer
        example: 42

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: Bad Request
        code:
          type: string
          description: Código identificador único del error devuelto por el servidor.
          example: MISSING_END_USER_ID
        method:
          type: string
          example: POST
        message:
          type: string
          description: Explicación legible del error.
          example: El backend debe enviar el UUID del usuario final en la cabecera x-user-id.
        quota:
          $ref: "#/components/schemas/QuotaUsage"

    QuotaUsage:
      type: object
      properties:
        currentStorageBytes:
          type: integer
          example: 52428800
        maxStorageBytes:
          type: integer
          example: 1073741824
        incomingFileSizeBytes:
          type: integer
          example: 115710
        currentPendingTickets:
          type: integer
          example: 2
        maxPendingTickets:
          type: integer
          example: 20

    WebhookDispatchResult:
      type: object
      description: Resultado del despacho del webhook tras confirmar un archivo o dispararlo manualmente.
      properties:
        configured:
          type: boolean
          example: true
        delivered:
          type: boolean
          example: true
        deliveryId:
          type: string
          format: uuid
          nullable: true
          example: 32d6a22d-041e-464f-9cf9-237be4d64984
        attempts:
          type: integer
          example: 1
        lastStatusCode:
          type: integer
          nullable: true
          example: 200
        error:
          type: string
          nullable: true
          description: |
            Si la entrega no se completó en línea, indica la causa:
            - `null`: Entregado exitosamente (o no configurado si `configured: false`).
            - `WEBHOOK_NOT_CONFIGURED`: La organización no tiene `webhook_url`.
            - `WEBHOOK_SECRET_NOT_CONFIGURED`: La organización tiene `webhook_url` pero no `webhook_secret`.
            - `CIRCUIT_BREAKER_QUEUED`: Las últimas 3 entregas fallaron; el evento quedó encolado en segundo plano para reintento automático sin bloquear tu petición.
            - `TIMEOUT`, `NETWORK_ERROR`, `TLS_ERROR`, `REDIRECT_BLOCKED`, `HTTP_500`, `SSRF_*`: Causa del fallo en el intento de envío.
          example: null

    WebhookPayload:
      type: object
      description: |
        Cuerpo JSON que nuestro servidor envía mediante `POST` a la `webhook_url` configurada en tu organización.
        **Cabeceras enviadas en la petición HTTP del Webhook:**
        - `Content-Type: application/json`
        - `x-webhook-signature: sha256=<hex>` *(HMAC-SHA256 de `${timestamp}.${rawBody}` usando tu `webhook_secret`)*
        - `x-webhook-timestamp: <ISO-8601>` *(ej. `2026-11-06T18:00:00.000Z`)*
        - `x-webhook-event: file.uploaded | file.processed | file.failed`
        - `x-webhook-attempt: 1..5`
        - `x-webhook-delivery-id: <uuid>`
      required:
        - event
        - deliveryId
        - timestamp
        - fileId
        - orgId
        - userId
        - status
        - fileStatus
        - scanStatus
        - visibility
        - sizeBytes
        - sha256Verified
      properties:
        event:
          type: string
          enum: [file.uploaded, file.processed, file.failed]
          example: file.uploaded
        deliveryId:
          type: string
          format: uuid
          nullable: true
          example: 32d6a22d-041e-464f-9cf9-237be4d64984
        timestamp:
          type: string
          format: date-time
          example: "2026-11-06T18:00:00.000Z"
        fileId:
          type: string
          format: uuid
          example: b087905a-00fd-4bcf-812c-5d8ba159d6c1
        ticketId:
          type: string
          format: uuid
          nullable: true
          example: 0c7dd33e-01b7-4603-8754-7cc15ca76d36
        orgId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        userId:
          type: string
          format: uuid
          example: a1111111-0000-0000-0000-000000000001
        status:
          type: string
          enum: [uploaded, processed, failed]
          example: uploaded
        fileStatus:
          type: string
          example: uploaded
        scanStatus:
          type: string
          enum: [not_scanned, clean, infected, skipped]
          example: not_scanned
        visibility:
          type: string
          enum: [private, public]
          example: private
        mimeType:
          type: string
          nullable: true
          example: image/jpeg
        sizeBytes:
          type: integer
          example: 115710
        sha256Hash:
          type: string
          nullable: true
          example: cddcc0f68162c07793f049cb893b0c7c41ad3fb05f29e60d5e55612c08a9264e
        sha256Verified:
          type: boolean
          example: true
        cloudfrontUrl:
          type: string
          nullable: true
          description: URL de CloudFront si `visibility` es `public`, o `null` si es `private`.
          example: null
        errorMessage:
          type: string
          nullable: true
          example: null

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Healthcheck público del servicio
      description: Verifica que el servicio se encuentra activo. No requiere autenticación y no expone variables de entorno ni datos internos.
      security: []
      responses:
        "200":
          description: Servicio operativo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: cloudinary-aws-backend
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-11-06T18:00:00.000Z"
        "429":
          description: Límite de peticiones excedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/upload:
    post:
      operationId: createUploadTicket
      tags: [Upload Simple]
      summary: Paso 1 — Solicitar ticket de subida simple y URL prefirmada de S3 (<= 25 MB)
      description: |
        Valida permisos, tipo de archivo (whitelist), tamaño (máximo 25 MB) y cuotas de la organización.
        Genera un ticket en estado `pending_upload`, una URL prefirmada `PUT` hacia Amazon S3 con **TTL de 5 minutos (300 s)** y un `confirmToken` firmado con HMAC-SHA256.

        **Importante al subir el binario a S3 (`PUT uploadUrl`):**
        Debes enviar en el `PUT` a S3 **exactamente** las cabeceras devueltas en el objeto `requiredHeaders` de esta respuesta (`Content-Type`, `Cache-Control`, `Content-Length`, `Content-Disposition` si es `.pdf`, y `x-amz-checksum-sha256` en Base64 si declaraste `sha256Hash`). **No envíes `x-api-key` ni `x-user-id` a Amazon S3.**
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/EndUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileName
                - fileType
                - fileSize
              properties:
                fileName:
                  type: string
                  description: Nombre original del archivo incluyendo su extensión permitida (`.jpg`, `.jpeg`, `.png`, `.webp`, `.gif`, `.pdf`).
                  example: factura-noviembre.jpg
                fileType:
                  type: string
                  description: Tipo MIME exacto correspondiente a la extensión (`image/jpeg`, `image/png`, `image/webp`, `image/gif`, `application/pdf`). También se acepta el alias `mimeType`.
                  example: image/jpeg
                fileSize:
                  type: integer
                  minimum: 1
                  maximum: 26214400
                  description: Tamaño exacto del archivo en bytes (entero positivo, máximo 26,214,400 bytes = 25 MB). También se acepta `sizeBytes`.
                  example: 115710
                visibility:
                  type: string
                  enum: [private, public]
                  default: private
                  description: |
                    Visibilidad del archivo:
                    - `private` (por defecto): Solo el usuario propietario puede solicitar URLs prefirmadas de lectura temporal (5 min).
                    - `public`: Se entrega mediante URL de Amazon CloudFront CDN.
                  example: private
                sha256Hash:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                  nullable: true
                  description: |
                    Hash SHA-256 del archivo en formato **hexadecimal** (64 caracteres).
                    Si se incluye, S3 exigirá en el `PUT` la cabecera `x-amz-checksum-sha256` (en Base64, devuelta lista para usar en `requiredHeaders["x-amz-checksum-sha256"]`) y verificará criptográficamente la integridad de los bytes recibidos.
                  example: cddcc0f68162c07793f049cb893b0c7c41ad3fb05f29e60d5e55612c08a9264e
                extension:
                  type: string
                  description: Extensión explícita opcional (debe coincidir con la extensión de `fileName`).
                  example: .jpg
      responses:
        "200":
          description: Ticket de subida emitido exitosamente.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketId:
                    type: string
                    format: uuid
                    example: 0c7dd33e-01b7-4603-8754-7cc15ca76d36
                  fileId:
                    type: string
                    format: uuid
                    example: b087905a-00fd-4bcf-812c-5d8ba159d6c1
                  uploadUrl:
                    type: string
                    format: uri
                    description: URL prefirmada de Amazon S3 donde debes hacer `PUT` con el binario del archivo antes de que expire (300 s).
                    example: https://practicas-alan-418272802078.s3.us-east-1.amazonaws.com/static/private/9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256&...
                  uploadMethod:
                    type: string
                    example: PUT
                  requiredHeaders:
                    type: object
                    additionalProperties:
                      type: string
                    description: Cabeceras exactas que tu cliente HTTP debe incluir en la petición `PUT` hacia `uploadUrl`.
                    example:
                      Content-Type: image/jpeg
                      Cache-Control: private, no-store, no-cache, max-age=0, must-revalidate
                      Content-Length: "115710"
                      x-amz-checksum-sha256: zdvA9oFiwHeT8EnLmTsMfEGtP7BVKea15VYS8IqSZk4=
                  isRealS3:
                    type: boolean
                    example: true
                  isMultipart:
                    type: boolean
                    example: false
                  expiresAt:
                    type: string
                    format: date-time
                    example: "2026-11-06T18:05:00.000Z"
                  expiresInSeconds:
                    type: integer
                    example: 300
                  confirmToken:
                    type: string
                    description: Token HMAC-SHA256 obligatorio para confirmar la subida en el Paso 3 (`PUT /api/upload`).
                    example: eyJ0aWNrZXRJZCI6IjBjN2RkMzNlLTAxYjctNDYwMy04NzU0LTdjYzE1Y2E3NmQzNiJ9.a8f5f167f44f4964e6c998dee827110c
        "400":
          description: |
            Petición inválida. Códigos posibles:
            - `MISSING_END_USER_ID`: Falta la cabecera `x-user-id` (requerida en llaves de organización). **Acción:** Envía `x-user-id: <uuid>`.
            - `INVALID_END_USER_ID`: `x-user-id` no tiene formato UUID v4. **Acción:** Corrige el formato del UUID.
            - `EXTENSION_MISMATCH`: El campo `extension` no coincide con la extensión de `fileName`. **Acción:** Usa la misma extensión en ambos o envía solo `fileName`.
            - `XSS_DANGEROUS_FILE_TYPE`: Archivo bloqueado por prevención de XSS (`.html`, `.svg`, `.js`, `.xml`, ejecutables). **Acción:** Sube únicamente formatos de la whitelist.
            - `VIDEO_TEMPORARILY_DISABLED`: Archivos de video (`video/*`, `.mp4`, etc.) fuera de alcance en la etapa actual. **Acción:** Sube solo imágenes permitidas o PDF.
            - `MISSING_FILE_EXTENSION`: `fileName` no tiene extensión. **Acción:** Incluye la extensión en `fileName` (ej. `foto.png`).
            - `UNSUPPORTED_FILE_EXTENSION`: Extensión no permitida. **Acción:** Usa `.jpg`, `.jpeg`, `.png`, `.webp`, `.gif` o `.pdf`.
            - `EXTENSION_MIME_MISMATCH`: El `fileType` no coincide con la extensión (ej. extensión `.png` con `image/jpeg`). **Acción:** Asegúrate de que `fileType` corresponda a la extensión.
            - `INVALID_FILE_SIZE`: `fileSize` no es un entero positivo mayor a 0. **Acción:** Envía el tamaño exacto en bytes (`fs.statSync(path).size`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            No autenticado. Códigos posibles:
            - `MISSING_API_KEY`: No se envió la cabecera `x-api-key`. **Acción:** Incluye `x-api-key: TU_API_KEY`.
            - `MISSING_VALIDATED_ORG`: Contexto de organización ausente. **Acción:** Verifica tu `x-api-key`.
            - `USER_NOT_REGISTERED`: El UUID enviado en `x-user-id` no existe en la base de datos. **Acción:** Usa un `userId` registrado en tu organización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Acceso denegado por permisos o aislamiento Multi-Tenant. Códigos posibles:
            - `INVALID_OR_INACTIVE_API_KEY`: La API Key no existe o fue revocada. **Acción:** Usa una API Key activa.
            - `INSUFFICIENT_API_KEY_PERMISSIONS`: La API Key tiene `can_upload = false`. **Acción:** Usa una llave con permiso de subida.
            - `FORBIDDEN_USER_IMPERSONATION`: La API Key está vinculada a un usuario específico pero enviaste otro `x-user-id`. **Acción:** Usa el mismo `x-user-id` o una llave de organización.
            - `FORBIDDEN_USER_ORG_MISMATCH` / `FORBIDDEN_CROSS_ORGANIZATION`: El usuario en `x-user-id` pertenece a otra organización. **Acción:** Usa un usuario perteneciente a tu organización.
            - `FORBIDDEN_NO_PERMISSION`: El usuario final tiene rol de solo lectura (`can_upload = false` en `users`). **Acción:** Usa un usuario con permiso de subida habilitado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            - `ORGANIZATION_NOT_FOUND`: La organización asociada no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: |
            Tamaño o cuota de almacenamiento excedidos. Códigos posibles:
            - `FILE_SIZE_EXCEEDS_LIMIT`: `fileSize` supera los 25 MB (`26,214,400` bytes). **Acción:** Usa el flujo `/api/upload/multipart` (soporta hasta 500 MB).
            - `STORAGE_QUOTA_EXCEEDED`: El archivo haría que la organización supere su cuota `max_storage_bytes`. **Acción:** Elimina archivos antiguos con `DELETE /api/files/{id}` o solicita ampliación de cuota al administrador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Límite de peticiones o tickets pendientes alcanzado. Códigos posibles:
            - `RATE_LIMIT_EXCEEDED`: Más de 100 peticiones en 60 segundos con esta API Key. **Acción:** Espera los segundos indicados en la cabecera `Retry-After`.
            - `PENDING_TICKETS_QUOTA_EXCEEDED`: La organización tiene demasiados tickets sin confirmar en estado `pending_upload` (por defecto máx. 20). **Acción:** Confirma tus subidas pendientes o espera a que expiren (5 min).
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |
            Error interno o de configuración:
            - `AWS_S3_NOT_CONFIGURED`, `S3_PRESIGNED_URL_FAILED`, `FILE_RECORD_INSERT_FAILED`, `AUTH_VERIFICATION_ERROR`, `USER_VERIFICATION_ERROR`, `MIDDLEWARE_INTERNAL_ERROR`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: |
            - `AUTH_TIMEOUT_ERROR`: Tiempo de espera agotado al validar credenciales (> 3.5 s). **Acción:** Reintenta la petición.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: confirmSimpleUpload
      tags: [Upload Simple]
      summary: Paso 3 — Confirmar subida simple tras haber enviado el archivo a S3
      description: |
        Verifica la firma HMAC del `confirmToken`, comprueba en Amazon S3 mediante `HeadObject` que el objeto existe y coincide en tamaño y MIME, inspecciona los primeros **32 bytes (Magic Bytes)** mediante `Range GET` para validar que el formato binario real corresponda al tipo declarado, verifica el checksum **SHA-256** en S3, marca el archivo como `uploaded` y despacha el webhook `file.uploaded` si la organización lo tiene configurado.

        > **Nota importante sobre `ticketId`:** El parámetro `ticketId` debe enviarse en la **query string** (`PUT /api/upload?ticketId=<uuid>`). El `confirmToken` puede enviarse en el cuerpo JSON (`{ "confirmToken": "..." }`) o en la query string (`&token=...`).
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/EndUserIdHeader"
        - name: ticketId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket devuelto por `POST /api/upload`.
          example: 0c7dd33e-01b7-4603-8754-7cc15ca76d36
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Alternativa opcional para enviar `confirmToken` por query string en lugar del body JSON.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmToken:
                  type: string
                  description: Token criptográfico recibido en `POST /api/upload` (también acepta el alias `token`).
                  example: eyJ0aWNrZXRJZCI6IjBjN2RkMzNlLTAxYjctNDYwMy04NzU0LTdjYzE1Y2E3NmQzNiJ9.a8f5f167f44f4964e6c998dee827110c
      responses:
        "200":
          description: Subida confirmada y verificada en S3.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  method:
                    type: string
                    example: PUT
                  message:
                    type: string
                    example: File upload confirmed for ticket 0c7dd33e-01b7-4603-8754-7cc15ca76d36
                  ticketId:
                    type: string
                    format: uuid
                    example: 0c7dd33e-01b7-4603-8754-7cc15ca76d36
                  fileId:
                    type: string
                    format: uuid
                    example: b087905a-00fd-4bcf-812c-5d8ba159d6c1
                  fileStatus:
                    type: string
                    example: uploaded
                  sha256Verified:
                    type: boolean
                    example: true
                  scanStatus:
                    type: string
                    example: not_scanned
                  visibility:
                    type: string
                    enum: [private, public]
                    example: private
                  ownerUserId:
                    type: string
                    format: uuid
                    example: a1111111-0000-0000-0000-000000000001
                  cacheControl:
                    type: string
                    example: private, no-store, no-cache, max-age=0, must-revalidate
                  cloudfrontUrl:
                    type: string
                    nullable: true
                    description: URL de CloudFront si `visibility` es `public`; siempre `null` si es `private`.
                    example: null
                  tokenVerified:
                    type: boolean
                    example: true
                  headVerification:
                    type: object
                    properties:
                      verified:
                        type: boolean
                        example: true
                      actualSizeBytes:
                        type: integer
                        example: 115710
                      actualContentType:
                        type: string
                        example: image/jpeg
                      eTag:
                        type: string
                        example: '"a1b2c3d4e5f60718293a4b5c6d7e8f90"'
                  verification:
                    type: object
                    properties:
                      magicBytesVerified:
                        type: boolean
                        example: true
                      detectedMimeType:
                        type: string
                        example: image/jpeg
                      checksumVerified:
                        type: boolean
                        example: true
                  webhook:
                    $ref: "#/components/schemas/WebhookDispatchResult"
        "400":
          description: |
            Error en los datos de confirmación o en la verificación contra S3. Códigos posibles:
            - `MISSING_TICKET_ID`: No enviaste `?ticketId=<uuid>` en la URL. **Acción:** Agrégalo como query param.
            - `MISSING_CONFIRM_TOKEN`: No enviaste `confirmToken` ni en el body ni en `?token=`. **Acción:** Envía el `confirmToken` recibido en el Paso 1.
            - `FILE_NOT_UPLOADED_TO_S3`: El objeto aún no existe en S3. **Acción:** Ejecuta primero el `PUT` binario hacia `uploadUrl` y verifica que S3 haya respondido `200 OK`.
            - `UPLOAD_VERIFICATION_MISMATCH`: El tamaño o `Content-Type` subido a S3 no coincide con lo declarado en el ticket (el objeto fue borrado de S3 y el ticket marcado como `failed`). **Acción:** Solicita un nuevo ticket declarando el `fileSize` y `fileType` exactos.
            - `INVALID_FILE_HEADER`: El archivo subido en S3 tiene menos de 4 bytes o no pudo leerse su cabecera. **Acción:** Solicita un nuevo ticket y sube un archivo íntegro.
            - `CHECKSUM_MISMATCH`: El checksum SHA-256 en S3 no coincide con el `sha256Hash` declarado en el ticket (el objeto fue borrado de S3). **Acción:** Recalcula el SHA-256 del archivo real y solicita un nuevo ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Violación de seguridad al confirmar. Códigos posibles:
            - `FORBIDDEN_CROSS_ORGANIZATION`: El ticket pertenece a otra organización.
            - `FORBIDDEN_USER_IMPERSONATION`: El `x-user-id` actual no es el usuario que creó el ticket. **Acción:** Confirma con el mismo `x-user-id` que solicitó el ticket.
            - `INVALID_CONFIRM_TOKEN`: El `confirmToken` fue alterado, no corresponde al ticket/usuario o expiró (`SIGNATURE_INVALID`, `TOKEN_MISMATCH`, `TOKEN_EXPIRED`, `TOKEN_MALFORMED`). **Acción:** Usa el `confirmToken` exacto devuelto por `POST /api/upload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            - `TICKET_NOT_FOUND`: El `ticketId` no existe. **Acción:** Verifica el UUID del ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            - `TICKET_ALREADY_COMPLETED`: Este ticket ya fue confirmado anteriormente (protección de idempotencia). **Acción:** No necesitas volver a confirmarlo; usa el `fileId` para consultar el archivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: |
            - `TICKET_EXPIRED`: Pasaron más de 7 minutos (5 min TTL + 2 min gracia) desde la emisión del ticket. **Acción:** Solicita un nuevo ticket con `POST /api/upload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            - `MAGIC_BYTES_MISMATCH`: Los primeros 32 bytes del archivo subido a S3 no corresponden al formato binario del MIME declarado (ej. subiste un archivo de texto renombrado como `.png`). El archivo fue eliminado de S3 automáticamente. **Acción:** Sube un archivo cuyo contenido binario real coincida con su extensión y tipo MIME.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      callbacks:
        fileUploadedWebhook:
          "{$request.body#/webhookUrl}":
            post:
              operationId: receiveFileUploadedWebhook
              summary: Webhook enviado al servidor de la organización tras confirmar la subida
              security: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/WebhookPayload"
              responses:
                "200":
                  description: El servidor receptor confirma la recepción del webhook con HTTP 2xx.
                "400":
                  description: Firma HMAC inválida o payload rechazado por el servidor receptor.

  /api/upload/multipart:
    post:
      operationId: multipartUploadAction
      tags: [Upload Multipart]
      summary: Iniciar sesión multipart (create), firmar URL de parte (presign_part) o completar (complete)
      description: |
        Endpoint unificado para el flujo **S3 Multipart Upload** (archivos de hasta **500 MB**), controlado por el campo `action` en el body JSON:
        1. `action: "create"` (valor por defecto): Inicia el Multipart Upload en S3 y devuelve `ticketId`, `fileId`, `uploadId` y `confirmToken` (válido por **60 minutos**).
        2. `action: "presign_part"`: Genera una URL prefirmada `PUT` (`uploadPartUrl`, válida por **15 minutos**) para subir una parte específica (`partNumber` entre `1` y `10000`). Al hacer el `PUT` binario a S3, **debes capturar la cabecera `ETag` de la respuesta de S3**. Todas las partes excepto la última deben medir al menos **5 MB (`5,242,880` bytes)**.
        3. `action: "complete"`: Ensambla las partes en S3, verifica tamaño con `HeadObject`, valida los primeros 32 bytes (`Magic Bytes`), marca el archivo como `uploaded` y dispara el webhook `file.uploaded`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/EndUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: "1. Iniciar Multipart (action: create)"
                  required: [fileName, fileType, fileSize]
                  properties:
                    action:
                      type: string
                      enum: [create]
                      default: create
                    fileName:
                      type: string
                      example: catalogo-alta-resolucion.pdf
                    fileType:
                      type: string
                      example: application/pdf
                    fileSize:
                      type: integer
                      minimum: 1
                      maximum: 524288000
                      example: 31457280
                    visibility:
                      type: string
                      enum: [private, public]
                      default: private
                - type: object
                  title: "2. Obtener URL prefirmada por parte (action: presign_part)"
                  required: [action, partNumber]
                  properties:
                    action:
                      type: string
                      enum: [presign_part]
                    ticketId:
                      type: string
                      format: uuid
                      example: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    fileId:
                      type: string
                      format: uuid
                      description: Alternativa a `ticketId`.
                    partNumber:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      example: 1
                - type: object
                  title: "3. Completar Multipart (action: complete)"
                  required: [action, confirmToken]
                  properties:
                    action:
                      type: string
                      enum: [complete]
                    ticketId:
                      type: string
                      format: uuid
                      example: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    fileId:
                      type: string
                      format: uuid
                    confirmToken:
                      type: string
                      example: eyJ0aWNrZXRJZCI6IjdlOGY5YTBiLTFjMmQtNGU1Zi04YTliLTBjMWQyZTNmNGE1YiJ9.9f8e7d...
                    parts:
                      type: array
                      description: Lista ordenada de partes subidas con su `PartNumber` y `ETag` devuelto por S3. Si se omite o envía vacía, el servidor consultará las partes subidas en S3 automáticamente (`ListPartsCommand`).
                      items:
                        type: object
                        required: [PartNumber, ETag]
                        properties:
                          PartNumber:
                            type: integer
                            example: 1
                          ETag:
                            type: string
                            example: '"b54357faf0632cce46e942fa68356b38"'
            examples:
              create:
                summary: "Paso 1: Iniciar subida multipart (action=create)"
                value:
                  action: create
                  fileName: catalogo-anual.pdf
                  fileType: application/pdf
                  fileSize: 31457280
                  visibility: private
              presign_part:
                summary: "Paso 2: Pedir URL prefirmada para la Parte 1 (action=presign_part)"
                value:
                  action: presign_part
                  ticketId: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                  partNumber: 1
              complete:
                summary: "Paso 4: Completar subida multipart (action=complete)"
                value:
                  action: complete
                  ticketId: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                  confirmToken: eyJ0aWNrZXRJZCI6IjdlOGY5YTBiLTFjMmQtNGU1Zi04YTliLTBjMWQyZTNmNGE1YiJ9.9f8e7d...
                  parts:
                    - PartNumber: 1
                      ETag: '"b54357faf0632cce46e942fa68356b38"'
                    - PartNumber: 2
                      ETag: '"c78912faf0632cce46e942fa68356b99"'
      responses:
        "200":
          description: Operación multipart ejecutada con éxito (`create`, `presign_part` o `complete`).
          content:
            application/json:
              schema:
                type: object
              examples:
                create_response:
                  summary: Respuesta de action=create
                  value:
                    status: success
                    action: create
                    ticketId: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    fileId: 4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d
                    uploadId: Vdf89s7df89s7df89s7df89s7df89s7df
                    visibility: private
                    cacheControl: private, no-store, no-cache, max-age=0, must-revalidate
                    contentDisposition: attachment
                    confirmToken: eyJ0aWNrZXRJZCI6IjdlOGY5YTBiLTFjMmQtNGU1Zi04YTliLTBjMWQyZTNmNGE1YiJ9.9f8e7d...
                    expiresInSeconds: 3600
                    minPartSizeBytes: 5242880
                presign_part_response:
                  summary: Respuesta de action=presign_part
                  value:
                    status: success
                    action: presign_part
                    ticketId: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    fileId: 4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d
                    uploadId: Vdf89s7df89s7df89s7df89s7df89s7df
                    partNumber: 1
                    uploadPartUrl: https://practicas-alan-418272802078.s3.us-east-1.amazonaws.com/static/private/...?partNumber=1&uploadId=...
                    expiresInSeconds: 900
                complete_response:
                  summary: Respuesta de action=complete
                  value:
                    status: success
                    action: complete
                    ticketId: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    fileId: 4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d
                    fileStatus: uploaded
                    sha256Verified: false
                    scanStatus: not_scanned
                    visibility: private
                    partsCompleted: 2
                    cloudfrontUrl: null
                    verification:
                      magicBytesVerified: true
                      detectedMimeType: application/pdf
                    webhook:
                      configured: false
                      delivered: false
                      deliveryId: null
                      attempts: 0
                      lastStatusCode: null
                      error: null
        "400":
          description: |
            Códigos posibles:
            - `MISSING_END_USER_ID`, `INVALID_FILE_SIZE`, `EXTENSION_MISMATCH`, `XSS_DANGEROUS_FILE_TYPE`, `VIDEO_TEMPORARILY_DISABLED`, `MISSING_FILE_EXTENSION`, `UNSUPPORTED_FILE_EXTENSION`, `EXTENSION_MIME_MISMATCH` (en `create`).
            - `INVALID_PART_NUMBER`: `partNumber` fuera del rango `1..10000` (en `presign_part`).
            - `MISSING_IDENTIFIER`: No se envió `ticketId` ni `fileId`.
            - `NO_ACTIVE_MULTIPART_UPLOAD`: El ticket ya fue completado, abortado o no es multipart.
            - `MISSING_CONFIRM_TOKEN`: Falta `confirmToken` (en `complete`).
            - `NO_PARTS_UPLOADED`: No hay partes subidas en S3 para este `uploadId`.
            - `FILE_NOT_FOUND_AFTER_COMPLETE`: El objeto ensamblado no se encontró en S3.
            - `MULTIPART_SIZE_MISMATCH`: La suma de bytes de las partes subidas no coincide con el `fileSize` declarado en `create` (el archivo ensamblado se borra de S3).
            - `INVALID_FILE_HEADER`: No se pudieron leer los primeros 32 bytes del objeto ensamblado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`MISSING_API_KEY`, `MISSING_VALIDATED_ORG` o `USER_NOT_REGISTERED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            - `FORBIDDEN_UPLOAD_PERMISSION`: El usuario no pertenece a la organización o no tiene `can_upload = true`.
            - `FORBIDDEN_TENANT_MISMATCH`: El ticket pertenece a otra organización.
            - `FORBIDDEN_NOT_OWNER`: El ticket pertenece a otro usuario distinto a `x-user-id`.
            - `INVALID_CONFIRM_TOKEN`: `confirmToken` inválido o expirado (> 60 min).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`MULTIPART_TICKET_NOT_FOUND`: No existe el ticket multipart indicado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: |
            - `MULTIPART_SIZE_EXCEEDS_LIMIT`: `fileSize` supera los 500 MB (`524,288,000` bytes).
            - `STORAGE_QUOTA_EXCEEDED`: Supera la cuota de almacenamiento de la organización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`MAGIC_BYTES_MISMATCH`: Los primeros 32 bytes del archivo ensamblado no coinciden con el MIME declarado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`RATE_LIMIT_EXCEEDED` o `PENDING_TICKETS_QUOTA_EXCEEDED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`MULTIPART_POST_ERROR`: Error interno o error de S3 al ensamblar partes (ej. partes intermedias menores a 5 MB)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: listMultipartParts
      tags: [Upload Multipart]
      summary: Listar partes ya subidas en S3 para un Multipart Upload activo
      description: Consulta en tiempo real a Amazon S3 (`ListPartsCommand`) qué partes han sido recibidas para un `ticketId` o `fileId` activo, permitiendo reanudar subidas interrumpidas.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/EndUserIdHeader"
        - name: ticketId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: UUID del ticket multipart (requiere `ticketId` o `fileId`).
        - name: fileId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: UUID del archivo multipart (alternativa a `ticketId`).
      responses:
        "200":
          description: Lista de partes subidas en S3.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  action:
                    type: string
                    example: list_parts
                  ticketId:
                    type: string
                    format: uuid
                  fileId:
                    type: string
                    format: uuid
                  uploadId:
                    type: string
                  declaredSizeBytes:
                    type: integer
                    example: 10485760
                  totalUploadedBytes:
                    type: integer
                    example: 10485760
                  partsCount:
                    type: integer
                    example: 2
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        PartNumber:
                          type: integer
                          example: 1
                        ETag:
                          type: string
                          example: '"b54357faf0632cce46e942fa68356b38"'
                        Size:
                          type: integer
                          example: 5242880
                        LastModified:
                          type: string
                          format: date-time
        "400":
          description: "`MISSING_IDENTIFIER` o `NO_ACTIVE_MULTIPART_UPLOAD`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`FORBIDDEN_TENANT_MISMATCH` o `FORBIDDEN_NOT_OWNER`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`MULTIPART_TICKET_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`S3_LIST_PARTS_FAILED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: completeMultipartUpload
      tags: [Upload Multipart]
      summary: Completar subida Multipart (alias directo de POST con action=complete)
      description: Ensambla las partes en Amazon S3 (`CompleteMultipartUploadCommand`), verifica `HeadObject` y los primeros 32 bytes (`Magic Bytes`), marca el archivo como `uploaded` y despacha el webhook `file.uploaded`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/EndUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmToken
              properties:
                ticketId:
                  type: string
                  format: uuid
                  example: 7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                fileId:
                  type: string
                  format: uuid
                confirmToken:
                  type: string
                  example: eyJ0aWNrZXRJZCI6IjdlOGY5YTBiLTFjMmQtNGU1Zi04YTliLTBjMWQyZTNmNGE1YiJ9.9f8e7d...
                parts:
                  type: array
                  items:
                    type: object
                    required: [PartNumber, ETag]
                    properties:
                      PartNumber:
                        type: integer
                        example: 1
                      ETag:
                        type: string
                        example: '"b54357faf0632cce46e942fa68356b38"'
      responses:
        "200":
          description: Subida multipart completada y verificada.
        "400":
          description: "`MISSING_IDENTIFIER`, `MISSING_CONFIRM_TOKEN`, `NO_ACTIVE_MULTIPART_UPLOAD`, `NO_PARTS_UPLOADED`, `FILE_NOT_FOUND_AFTER_COMPLETE`, `MULTIPART_SIZE_MISMATCH`, `INVALID_FILE_HEADER`."
          content:
            application/json:
