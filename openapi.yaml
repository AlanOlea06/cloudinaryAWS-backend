                    type: string
                    format: uuid
                  fileId:
                    type: string
                    format: uuid
                  uploadIdAborted:
                    type: string
                  s3Aborted:
                    type: boolean
                    example: true
                  rowDeleted:
                    type: boolean
                    example: false
        "400":
          description: "`MISSING_IDENTIFIER`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
