          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`MULTIPART_TICKET_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/files:
    get:
      operationId: listFiles
      tags: [Files]
      summary: Listar archivos de la organización
      description: Lista los archivos registrados en la organización asociada a la API Key (ordenados del más reciente al más antiguo). Si se envía `x-user-id` o el query param `?userId=<uuid>`, filtra únicamente los archivos de ese usuario.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OptionalEndUserIdHeader"
        - name: userId
          in: query
