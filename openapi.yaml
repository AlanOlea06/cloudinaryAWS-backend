                          type: string
                          format: date-time
        "401":
          description: "`MISSING_API_KEY` o `MISSING_VALIDATED_ORG`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`INVALID_OR_INACTIVE_API_KEY` o `INSUFFICIENT_API_KEY_PERMISSIONS` (requiere `can_read=true`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
